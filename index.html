<style>

</style>
<style>
/* Layout: una columna de lectura (máx. 680px), barra de pestañas fija abajo, sesiones como fichas por fecha */
:root{
  --bg:#ECEDEF; --surface:#F8F8F9; --line:#D3D7DE; --fg:#1C2130; --muted:#586074;
  --accent:#2E4A7D; --accent-soft:#DDE4F1; --gold:#80601C; --gold-soft:#F0E8D5;
  --paper:#F8F8F9; --ink:#1C2130; --ink-muted:#586074;
  --f-display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --read-size:18px; --read-lh:1.7;
  --nav-h:64px; --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131A; --surface:#181C25; --line:#2A303E; --fg:#E7E4DC; --muted:#9AA1B0;
    --accent:#A3B8E4; --accent-soft:#222E47; --gold:#D9B96E; --gold-soft:#2B2517;
    --paper:#181C25; --ink:#E7E4DC; --ink-muted:#9AA1B0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131A; --surface:#181C25; --line:#2A303E; --fg:#E7E4DC; --muted:#9AA1B0;
  --accent:#A3B8E4; --accent-soft:#222E47; --gold:#D9B96E; --gold-soft:#2B2517;
  --paper:#181C25; --ink:#E7E4DC; --ink-muted:#9AA1B0; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px)}

/* Encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.1;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-ui);font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.back{border:0;background:none;padding:6px 8px 6px 0;color:var(--accent);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px}

/* Barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:12px}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--accent);font-weight:700}

.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1,h2,h3{text-wrap:balance;margin:0}
.h-view{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1.05;margin:22px 0 4px}
.lede{color:var(--muted);margin:0 0 18px}
.stack{display:flex;flex-direction:column;gap:14px}

/* Ficha de próxima sesión */
.next{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.next-head{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:18px 18px 14px;align-items:start}
.cal{min-width:64px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px 8px;background:var(--bg)}
.cal b{display:block;font-family:var(--f-display);font-size:38px;line-height:1;font-weight:600}
.cal span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.next h2{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1.05;margin-top:4px}
.src{color:var(--muted);font-size:14px;margin-top:4px}
.feast{font-size:13px;color:var(--gold);margin-top:6px;font-style:italic}
.idea{margin:0;padding:14px 18px;border-top:1px solid var(--line);font-family:var(--f-read);font-size:17px;line-height:1.6}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--fg);font-weight:700;font-size:15px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold)}

/* Pregunta de la semana */
.week{background:var(--gold-soft);border-radius:var(--r);padding:20px 18px}
.week .eyebrow{color:var(--gold)}
.week q{display:block;quotes:none;font-family:var(--f-display);font-style:italic;font-weight:500;font-size:27px;line-height:1.2;margin:10px 0 12px;color:var(--fg)}
.week p{margin:0 0 10px;font-size:15px}
.week .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* Lista de sesiones */
.sess{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--fg)}
.sess .cal{min-width:0;padding:4px 4px 6px}
.sess .cal b{font-size:28px}
.sess h3{font-family:var(--f-display);font-size:23px;font-weight:600;line-height:1.1}
.sess .meta{font-size:13px;color:var(--muted);margin-top:2px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.proxima{background:var(--accent-soft);color:var(--accent)}
.pill.realizada{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.planeada{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.sess.tbd h3{color:var(--muted);font-style:italic;font-weight:500}
.month{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:10px 0 -4px}

/* Reflexiones y temas (datos compartidos del grupo) */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.refl{margin-top:30px}
.refl .sec-t{margin-top:4px}
.refl p{margin:0 0 12px;color:var(--muted);font-size:15px}
.fld{display:block;margin:0 0 12px;font-weight:700;font-size:14px}
.fld input[type=text],.fld textarea,.tform input[type=text]{display:block;width:100%;margin-top:6px;padding:12px 14px;min-height:46px;font:inherit;font-size:16px;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px}
.fld textarea{resize:vertical;min-height:110px;line-height:1.5}
.fld input:disabled{opacity:.5}
.chk{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:15px;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.count{display:block;text-align:right;font-weight:400;color:var(--muted);font-size:12px;margin-top:4px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.fmsg{margin:12px 0 0!important;font-weight:700;color:var(--accent)!important}
.fmsg.err{color:#B3261E!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fmsg.err{color:#F2B8B5!important}}
:root[data-theme="dark"] .fmsg.err{color:#F2B8B5!important}
.rlist{display:flex;flex-direction:column;gap:12px}
.rit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.rit p{margin:0 0 8px;color:var(--fg);font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.rit small{color:var(--muted);font-size:13px}
.vacio{color:var(--muted);font-style:italic;margin:0}
.tform{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.tform input[type=text]{flex:1 1 220px;margin-top:0}
.tit{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 16px}
.tit span{flex:1;min-width:0;overflow-wrap:anywhere}
.like{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:64px;justify-content:center;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;font-size:15px}
.like svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.like[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.like[aria-pressed="true"] svg{fill:currentColor}
.like:disabled{opacity:.6}

/* Detalle de sesión */
.s-head{margin-top:18px}
.s-head h1{font-family:var(--f-display);font-weight:600;font-size:40px;line-height:1.02;margin:6px 0 4px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:15;background:var(--bg);display:flex;gap:4px;margin:16px -16px 0;padding:8px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;min-height:40px}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.progress{position:fixed;left:0;top:0;height:3px;background:var(--gold);width:0;z-index:40;transition:width .1s linear}

/* Lector */
.reader{margin-top:16px;background:var(--paper);color:var(--ink);border-radius:var(--r);border:1px solid var(--line);padding:22px 20px 28px;font-family:var(--f-read);font-size:var(--read-size);line-height:var(--read-lh)}
.reader[data-paper="sepia"]{--paper:#F3EAD8;--ink:#3B2F1E;--ink-muted:#6E5D44;border-color:#E1D3B6}
.reader[data-paper="noche"]{--paper:#0D0F14;--ink:#CFCAC0;--ink-muted:#8C8A84;border-color:#23262E}
.reader[data-font="sans"]{font-family:var(--f-ui)}
.reader .r-meta{font-family:var(--f-ui);font-size:13px;color:var(--ink-muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.reader .central{font-style:italic;font-size:1.08em;border-left:2px solid var(--gold);padding-left:14px;margin:14px 0 26px}
.punto{padding:18px 0;border-top:1px solid color-mix(in srgb, var(--ink) 14%, transparent)}
.punto h2{font-family:var(--f-display);font-weight:600;font-size:1.45em;line-height:1.1;display:flex;gap:10px;align-items:baseline}
.punto h2 span{font-family:var(--f-ui);font-size:.5em;font-weight:700;color:var(--ink-muted);letter-spacing:.06em;min-width:1.6em}
.punto p{margin:.7em 0 0;max-width:62ch}
.ref{font-family:var(--f-ui);font-size:.78em;font-weight:700;color:var(--ink-muted);white-space:nowrap}
.aterriza{margin-top:.9em;font-size:.92em;padding:10px 14px;border-radius:10px;background:color-mix(in srgb, var(--ink) 6%, transparent)}
.aterriza b{font-family:var(--f-ui);font-size:.78em;letter-spacing:.1em;text-transform:uppercase;display:block;color:var(--ink-muted);margin-bottom:2px}

/* Controles de lectura */
.rbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px}
.rbar .hint{font-size:13px;color:var(--muted)}
.rpanel{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:12px}
.rrow{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px}
.rrow>span{font-size:13px;color:var(--muted);font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;min-width:0}
.seg button{flex:1;border:0;background:none;min-height:40px;padding:0 6px;cursor:pointer;font-size:14px;color:var(--fg)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.focus-exit{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50}
body.focus .top, body.focus .nav, body.focus .tabs, body.focus .s-head, body.focus .rbar, body.focus .rpanel{display:none}
body.focus .reader{border:0;margin-top:0}

/* Dinámica */
.agenda{display:grid;gap:0;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.step{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:14px 16px}
.step+.step{border-top:1px solid var(--line)}
.step .min{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);font-size:15px}
.step .min small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.step h3{font-size:16px}
.step p{margin:4px 0 0;font-size:15px;color:var(--muted)}
.ronda{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ronda-h{display:flex;justify-content:space-between;align-items:start;gap:10px}
.ronda h3{font-family:var(--f-display);font-size:25px;font-weight:600;line-height:1.1}
.ronda .sub{font-size:13px;color:var(--muted);margin-top:2px}
.ronda ol{margin:12px 0 0;padding-left:1.3em;display:grid;gap:10px;font-family:var(--f-read);font-size:17px;line-height:1.5}
.reglas{font-size:15px;padding:14px 16px;border-radius:var(--r);border:1px dashed var(--line)}
.reglas ul{margin:6px 0 0;padding-left:1.2em;display:grid;gap:4px}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer b{font-variant-numeric:tabular-nums;font-size:22px;min-width:3.2ch}
.timer small{font-size:12px;opacity:.75;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{border:0;border-radius:999px;min-height:36px;padding:0 12px;background:var(--bg);color:var(--fg);font-weight:700;cursor:pointer}
.timer.done{background:var(--gold);color:var(--surface)}
.coord-link{display:grid;gap:2px;margin-top:28px;padding:16px 18px;border:1px dashed var(--line);border-radius:var(--r);text-decoration:none;color:var(--fg)}
.coord-link b{font-size:16px;color:var(--accent)}
.coord-link span:last-child{font-size:14px;color:var(--muted)}
.coord-head .eyebrow{color:var(--gold)}
.central-c{margin:0 0 14px;font-family:var(--f-read);font-style:italic;font-size:17px;line-height:1.6;border-left:2px solid var(--gold);padding-left:14px}
.step .min small{overflow-wrap:anywhere}

/* Material y biblioteca */
.mat{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--fg)}
.mat .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em}
.mat.pending{border-style:dashed;background:transparent}
.mat.pending .ic{background:var(--bg);color:var(--muted)}
.mat h3{font-size:16px}
.mat p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.refs div{padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:14px}
.refs b{display:block;font-size:15px}
.refs span{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;min-height:38px;font-size:14px;cursor:pointer;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:15px}
.sec-t{font-family:var(--f-display);font-weight:600;font-size:26px;margin:26px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
textarea.copyfb{width:100%;min-height:90px;margin-top:10px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<div class="progress" id="progress" hidden></div>
<main class="wrap" id="app"></main>
<nav class="nav" aria-label="Secciones"><div class="nav-in">
  <a href="#inicio" data-nav="inicio"><svg viewBox="0 0 24 24"><path d="M12 3v4M10 5h4"/><path d="M5 21V11l7-4 7 4v10"/><path d="M10 21v-5h4v5"/></svg>Inicio</a>
  <a href="#sesiones" data-nav="sesiones"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Sesiones</a>
  <a href="#biblioteca" data-nav="biblioteca"><svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/></svg>Biblioteca</a>
  <a href="#temas" data-nav="temas"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>Temas</a>
</div></nav>
<div id="timer-slot"></div>

<script>
/* ===== Contenido del grupo. Cada quincena se agrega una sesión aquí. ===== */
const SESIONES = [
  {
    id: "s-2026-10-02",
    fecha: "2026-10-02",
    tema: "El desierto",
    fuente: "Apuntes sobre la oración · Capítulo VI",
    categoria: "Oración",
    lectura: "12 min de lectura",
    idea: "El desierto es el lugar donde Dios, quitándonos los apoyos de siempre, nos habla al corazón y nos muestra su verdadero rostro: no el de un amo, sino el de un esposo que tiene sed de nosotros.",
    puntos: [

const parseDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const MES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const fechaLarga = s => { const t = parseDate(s).toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); return t.charAt(0).toUpperCase() + t.slice(1); };
const mesAnio = s => { const t = parseDate(s).toLocaleDateString("es-MX", { month: "long", year: "numeric" }); return t.charAt(0).toUpperCase() + t.slice(1); };
const cal = s => { const d = parseDate(s); return `<div class="cal" aria-hidden="true"><b>${d.getDate()}</b><span>${MES[d.getMonth()]}</span></div>`; };

function estado(s) {
  if (!s.tema) return "planeada";
  if (parseDate(s.fecha) < today) return "realizada";
  return "proxima";
}
const ETIQ = { proxima: "Próxima", realizada: "Realizada", planeada: "Por definir" };
function proxima() {
  const futuras = SESIONES.filter(s => s.tema && parseDate(s.fecha) >= today).sort((a, b) => a.fecha.localeCompare(b.fecha));
  if (futuras.length) return futuras[0];
  return SESIONES.filter(s => s.tema).sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.role = "status"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2000);
}

function copiar(texto, holder) {
  const fallback = () => {
    let ta = holder.querySelector("textarea.copyfb");
    if (!ta) { ta = document.createElement("textarea"); ta.className = "copyfb"; ta.readOnly = true; holder.appendChild(ta); }
    ta.value = texto; ta.focus(); ta.select(); toast("Selecciona el texto y cópialo");
  };
  try { navigator.clipboard.writeText(texto).then(() => toast("Copiado"), fallback); } catch (e) { fallback(); }
}

/* ===== Conexión con la hoja del grupo (reflexiones y temas) ===== */
const API_URL = "https://restrategia-n8n.fcwppp.easypanel.host/webhook/pausa";
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function api(body) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
  try {
    const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: ctl.signal });
    let j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok || !j || j.ok === false) { const err = new Error((j && j.message) || "Error de conexión"); err.status = r.status; throw err; }
    return j;
  } finally { clearTimeout(to); }
}
const cache = {};
async function cargar(clave, body, fuerza) {
  const c = cache[clave];
  if (c && !fuerza && Date.now() - c.t < 60000) return c.data;
  const data = await api(body); cache[clave] = { t: Date.now(), data }; return data;
}

    <div class="stack">
      <div class="reglas"><b>Acuerdos del grupo</b><ul>${d.reglas.map(r => `<li>${r}</li>`).join("")}</ul></div>
      ${d.rondas.map(r => `<div class="ronda">
        <div class="eyebrow">${r.sub}</div><h3>${r.t}</h3>
        <ol>${r.q.map(q => `<li>${q}</li>`).join("")}</ol>
      </div>`).join("")}
    </div>`;
}

function vCoordinador(s) {
  const d = s.dinamica;
  const porPunto = Math.round(d.agenda.find(a => /Exposición/.test(a.t)).min / s.puntos.length);
  return `<div class="s-head coord-head">
      <div class="eyebrow">Solo para quien coordina · ${fechaLarga(s.fecha)}</div>
      <h1>Guía del coordinador</h1>
      <div class="src">${s.tema} · ${s.fuente}</div>
    </div>
    <p class="lede" style="margin-top:14px">Esta parte no la necesitan los participantes: ellos usan la guía de lectura y las preguntas. Duración total: ${d.duracion} minutos.</p>
    <h2 class="sec-t">Orden de la sesión</h2>
    <div class="agenda" style="margin-top:0">${d.agenda.map(a => `<div class="step"><div class="min">${a.min}<small>min</small></div><div style="min-width:0"><h3>${a.t}</h3><p>${a.d}</p></div></div>`).join("")}</div>
    <h2 class="sec-t">Guion de exposición</h2>
    <p class="lede" style="margin-top:-4px">Unos ${porPunto} minutos por punto. Primero la idea central:</p>
    <p class="central-c">${s.idea}</p>
    <div class="agenda">${s.puntos.map((p, i) => `<div class="step"><div class="min">${i + 1}<small>${p.refs.split(" · ")[0]}</small></div><div style="min-width:0"><h3>${p.t}</h3><p>${p.a}</p></div></div>`).join("")}</div>
    <h2 class="sec-t">Rondas en grupos pequeños</h2>
    <p class="lede" style="margin-top:-4px">Forma grupos de 3 o 4 y lee los acuerdos antes de empezar. Usa el temporizador de cada ronda.</p>
    <div class="stack">
      ${d.rondas.map((r, i) => `<div class="ronda">
        <div class="ronda-h"><div style="min-width:0"><div class="eyebrow">Ronda ${i + 1} · ${r.sub}</div><h3>${r.t}</h3></div>
        <button class="btn" data-timer="${r.min}" data-label="Ronda ${i + 1}: ${r.t}" style="min-height:40px;padding:0 12px">▶ ${r.min} min</button></div>
        <ol>${r.q.map(q => `<li>${q}</li>`).join("")}</ol>
      </div>`).join("")}
    </div>`;
}

function seg(nombre, opciones, actual) {
  return `<div class="seg" role="group">${opciones.map(([v, l, aria]) => `<button data-set="${nombre}" data-val="${v}" aria-pressed="${String(v) === String(actual)}"${aria ? ` aria-label="${aria}"` : ""}>${l}</button>`).join("")}</div>`;
}

function guia(s) {
  const abierto = store.get("panel", false);
  return `<div class="rbar">
      <span class="hint">${s.lectura} · 7 puntos</span>
      <div style="display:flex;gap:6px">
        <button class="btn" data-act="panel" aria-expanded="${abierto}" style="min-height:40px;padding:0 14px"><span style="font-family:var(--f-read);font-size:17px">Aa</span> Lectura</button>
        <button class="btn" data-act="focus" style="min-height:40px;padding:0 14px">Enfoque</button>
      </div>
    </div>
    <div class="rpanel" id="rpanel" ${abierto ? "" : "hidden"}>
      <div class="rrow"><span>Tamaño</span>${seg("size", [["-", "A−", "Letra más chica"], ["r", `${lectura.size}px`, "Tamaño normal"], ["+", "A+", "Letra más grande"]], "")}</div>
      <div class="rrow"><span>Letra</span>${seg("font", [["serif", "Con serifa"], ["sans", "Sin serifa"]], lectura.font)}</div>
      <div class="rrow"><span>Interlineado</span>${seg("lh", [["compacto", "Compacto"], ["normal", "Normal"], ["amplio", "Amplio"]], lectura.lh)}</div>
      <div class="rrow"><span>Fondo</span>${seg("paper", [["auto", "Página"], ["sepia", "Sepia"], ["noche", "Noche"]], lectura.paper)}</div>
    </div>
    <article class="reader" id="reader" data-font="${lectura.font}" data-paper="${lectura.paper}">
      <div class="r-meta"><span>Idea central</span><span>${s.fuente}</span></div>
      <p class="central">${s.idea}</p>
      ${s.puntos.map((p, i) => `<section class="punto">
        <h2><span>${i + 1}</span>${p.t}</h2>
        ${p.p.map(x => `<p>${x}</p>`).join("")}
        <p class="ref">${p.refs}</p>
        <div class="aterriza"><b>Para aterrizar</b>${p.a}</div>
      </section>`).join("")}
    </article>`;
}

function material(s) {
  return `<h2 class="sec-t" style="margin-top:18px">Para leer antes</h2>
    <p class="lede" style="margin-top:-4px">Empieza por aquí. Después, la pestaña Guía te ayuda a repasar el capítulo por puntos.</p>
    <div class="stack">${s.materiales.map(m => tarjetaMat({ ...m, href: m.url, pending: !m.url })).join("")}</div>
    <h2 class="sec-t">Textos bíblicos</h2>
    <p class="lede" style="margin-top:-4px">Búscalos en tu Biblia. La numeración de Oseas cambia según la edición.</p>
    <div class="refs">${s.biblia.map(([r, d]) => `<div><b>${r}</b><span>${d}</span></div>`).join("")}</div>`;
}

/* ===== Enrutado ===== */
function render() {
  const h = (location.hash || "#inicio").slice(1);
  const ses = SESIONES.find(s => s.id === h && s.tema);
  const coord = h.startsWith("coord-") ? SESIONES.find(s => "coord-" + s.id === h && s.dinamica) : null;
  document.querySelectorAll("[data-nav]").forEach(a => a.removeAttribute("aria-current"));
  document.body.classList.remove("focus");
  $("#progress").hidden = true;
  let html;
  if (coord) { header(coord.id); html = vCoordinador(coord); }
  else if (ses) { header("sesiones"); html = vDetalle(ses); $("#progress").hidden = tabSesion !== "guia"; }
  else {
    const v = ["inicio", "sesiones", "biblioteca", "temas"].includes(h) ? h : "inicio";
    header(null);
    const a = document.querySelector(`[data-nav="${v}"]`); if (a) a.setAttribute("aria-current", "page");
    html = { inicio: vInicio, sesiones: vSesiones, biblioteca: vBiblioteca, temas: vTemas }[v]();
  }
  $("#app").innerHTML = html;
  aplicarLectura();
  if ($("#rlist")) cargarReflexiones($("#rlist").dataset.sid);
  if ($("#tlist")) cargarTemas();
  const fx = $(".focus-exit"); if (fx) fx.remove();
}
function aplicarLectura() {
  document.documentElement.style.setProperty("--read-size", lectura.size + "px");
  document.documentElement.style.setProperty("--read-lh", LH[lectura.lh]);
  const r = $("#reader"); if (r) { r.dataset.font = lectura.font; r.dataset.paper = lectura.paper; }
}

/* ===== Eventos ===== */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.tab) { tabSesion = t.dataset.tab; store.set("tab2", tabSesion); if (location.hash === t.getAttribute("href")) { e.preventDefault(); render(); } return; }
  if (t.dataset.go) { location.hash = t.dataset.go; return; }
  if (t.dataset.stab) { tabSesion = t.dataset.stab; store.set("tab2", tabSesion); const y = window.scrollY; render(); window.scrollTo(0, Math.min(y, $(".tabs").offsetTop - 60)); return; }
  if (t.dataset.cat) { filtroCat = t.dataset.cat; render(); return; }
  if (t.dataset.copy) { const s = SESIONES.find(x => x.id === t.dataset.copy); copiar(textoSemana(s), t.closest(".week")); return; }
  if (t.dataset.timer) { iniciarTimer(+t.dataset.timer * 60, t.dataset.label); return; }
  if (t.dataset.act === "panel") { const p = $("#rpanel"); p.hidden = !p.hidden; t.setAttribute("aria-expanded", String(!p.hidden)); store.set("panel", !p.hidden); return; }
  if (t.dataset.act === "focus") { document.body.classList.add("focus"); const b = document.createElement("button"); b.className = "btn primary focus-exit"; b.textContent = "Salir del enfoque"; b.dataset.act = "unfocus"; document.body.appendChild(b); window.scrollTo(0, 0); return; }
  if (t.dataset.act === "unfocus") { document.body.classList.remove("focus"); t.remove(); return; }
  if (t.dataset.set) {
    const k = t.dataset.set, v = t.dataset.val;
    if (k === "size") { lectura.size = v === "+" ? Math.min(28, lectura.size + 2) : v === "-" ? Math.max(14, lectura.size - 2) : 18; }
    else lectura[k] = v;
    store.set("lectura", lectura);
    const grupo = t.parentElement;
    if (k === "size") grupo.querySelector('[data-val="r"]').textContent = lectura.size + "px";
    else grupo.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.val === v)));
    aplicarLectura();
  }
});
/* ===== Envío de formularios y likes ===== */
document.addEventListener("input", e => {
  const ta = e.target.closest("textarea[name=reflexion]"); if (ta) { const c = ta.parentElement.querySelector(".count"); if (c) c.textContent = ta.value.length + " / 1200"; }
  const an = e.target.closest("input[name=anon]"); if (an) { const n = an.form.elements.nombre; n.disabled = an.checked; }
});
function mensaje(form, txt, err) { const m = form.querySelector(".fmsg"); if (m) { m.textContent = txt; m.classList.toggle("err", !!err); } }
document.addEventListener("submit", async e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const btn = f.querySelector("button[type=submit]"), web = f.elements.web.value;
  if (f.dataset.form === "reflexion") {
    const anon = f.elements.anon.checked, nombre = anon ? "Anónimo" : f.elements.nombre.value.trim(), texto = f.elements.reflexion.value.trim();
    if (!nombre) return mensaje(f, "Escribe tu nombre o marca la casilla para compartir sin nombre.", true);
    if (texto.length < 10) return mensaje(f, "Tu reflexión necesita al menos 10 caracteres.", true);
    btn.disabled = true; mensaje(f, "Enviando…");
    try {
      const d = await api({ action: "reflexion_add", sesion_id: f.dataset.sid, nombre, reflexion: texto, web });
      if (!anon) store.set("nombre", nombre);
      f.elements.reflexion.value = ""; f.querySelector(".count").textContent = "0 / 1200";
      mensaje(f, d.message || "Gracias por compartir.");
      cargarReflexiones(f.dataset.sid, true);
    } catch (err) { mensaje(f, err.status === 400 ? err.message : "No pudimos enviarla. Revisa tu conexión e inténtalo de nuevo.", true); }
    btn.disabled = false;
  } else if (f.dataset.form === "tema") {
    const tema = f.elements.tema.value.trim();
    if (tema.length < 5) return mensaje(f, "Escribe el tema con al menos 5 caracteres.", true);
    btn.disabled = true; mensaje(f, "Enviando…");
    try {
      const d = await api({ action: "tema_add", tema, web });
      f.elements.tema.value = ""; mensaje(f, d.message || "¡Gracias!");
      await cargarTemas(true);
    } catch (err) { mensaje(f, err.status === 400 ? err.message : "No pudimos enviarla. Revisa tu conexión e inténtalo de nuevo.", true); }
    btn.disabled = false;
  }
});
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.act === "retry-r") { cargarReflexiones(t.dataset.sid, true); return; }
  if (t.dataset.act === "retry-t") { cargarTemas(true); return; }
  if (t.dataset.like) {
    const id = t.dataset.like, liked = store.get("likes", []), had = liked.includes(id), delta = had ? -1 : 1, b = t.querySelector("b"), antes = Number(b.textContent) || 0;
    t.disabled = true;
    const aplicar = (on, n) => { t.setAttribute("aria-pressed", String(on)); b.textContent = Math.max(0, n); };
    aplicar(!had, antes + delta);
    try {
      await api({ action: "tema_vote", id, delta, web: "" });
      store.set("likes", had ? liked.filter(x => x !== id) : [...liked, id]);
      if (cache.temas) { const x = cache.temas.data.temas.find(y => y.id === id); if (x) x.votos = Math.max(0, (Number(x.votos) || 0) + delta); }
    } catch (err) { aplicar(had, antes); toast(err.status === 404 ? "Ese tema ya no existe" : "No se pudo registrar tu like"); }
    t.disabled = false;
  }
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
window.addEventListener("scroll", () => {
  const r = $("#reader"), p = $("#progress"); if (!r || p.hidden) return;
  const top = r.getBoundingClientRect().top + window.scrollY, h = r.offsetHeight - window.innerHeight;
  const pct = Math.max(0, Math.min(1, (window.scrollY - top + 80) / Math.max(1, h)));
  p.style.width = (pct * 100) + "%";
}, { passive: true });

/* ===== Temporizador para las rondas ===== */
let tm = null, restante = 0, pausado = false, lock = null;
function iniciarTimer(seg, label) {
  clearInterval(tm); restante = seg; pausado = false;
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => lock = l).catch(() => {}); } catch (e) {}
  $("#timer-slot").innerHTML = `<div class="timer" id="timer" role="timer" aria-live="off"><div style="display:flex;flex-direction:column;min-width:0"><b id="t-v"></b><small>${label}</small></div><button id="t-p">Pausa</button><button id="t-x" aria-label="Cerrar temporizador">✕</button></div>`;
  $("#t-p").onclick = () => { if (restante <= 0) return; pausado = !pausado; $("#t-p").textContent = pausado ? "Seguir" : "Pausa"; };
  $("#t-x").onclick = pararTimer;
  pintar(); tm = setInterval(() => { if (pausado) return; restante--; pintar(); if (restante <= 0) { clearInterval(tm); $("#timer").classList.add("done"); $("#t-v").textContent = "Tiempo"; $("#t-p").hidden = true; try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} } }, 1000);
}
function pintar() { const m = Math.floor(restante / 60), s = restante % 60; const v = $("#t-v"); if (v) v.textContent = `${m}:${String(s).padStart(2, "0")}`; }
function pararTimer() { clearInterval(tm); $("#timer-slot").innerHTML = ""; try { lock && lock.release(); } catch (e) {} lock = null; }

render();
</script>
</body>
</html>
